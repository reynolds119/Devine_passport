<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Set a new password · Divine Passport</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth">
      <img
        class="logo"
        src="assets/images/logo.png"
        alt="Pure Fire Miracle Ministries International"
      />
      <h2>Set a new password</h2>
      <p class="sub" id="status" role="status">Checking your recovery link…</p>
      <form id="reset-form" hidden>
        <label for="password"
          >New password (8+ characters, 1 capital, 1 number)</label
        >
        <input
          type="password"
          id="password"
          autocomplete="new-password"
          required
        />
        <button class="btn" id="submit" type="submit">Update password</button>
      </form>
      <div class="links"><a href="login.html">Back to sign in</a></div>
    </div>
    <script type="module">
      import { supabase } from "./js/supabase.js";
      import { validPassword } from "./js/auth.js";
      import { $, busy, toast } from "./js/utils.js";

      const form = $("#reset-form");
      const status = $("#status");
      try {
        const { data, error } = await supabase.auth.getSession();
        if (error) throw error;
        if (!data.session)
          throw new Error(
            "This password reset link is invalid or has expired. Request a new one from sign in.",
          );
        status.textContent = "Choose a new password for your account.";
        form.hidden = false;
      } catch (error) {
        status.textContent = error.message;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = $("#password").value;
        if (!validPassword(password)) {
          toast(
            "Use at least 8 characters, including one capital letter and one number.",
            "error",
          );
          return;
        }

        const button = $("#submit");
        busy(button, true);
        try {
          const { error } = await supabase.auth.updateUser({ password });
          if (error) throw error;
          form.hidden = true;
          status.textContent =
            "Your password has been updated. You can now sign in with it.";
        } catch (updateError) {
          toast(updateError.message, "error");
        } finally {
          busy(button, false);
        }
      });
    </script>
  </body>
</html>
